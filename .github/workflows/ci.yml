name: CI

# Flutter analysis and tests. Runs on pushes to main and by hand; pull
# requests from forks get no secrets (none are needed here).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Generated localizations are committed
        run: git diff --exit-code -- lib/core/localization/generated
      - run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::dart format differences"
      - run: flutter analyze
      - run: flutter test
